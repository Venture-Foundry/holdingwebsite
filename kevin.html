<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Ashby — Venture Foundry</title>
<meta name="description" content="Kevin Ashby, Co-Founder of Venture Foundry — save contact details.">
<link rel="icon" type="image/png" href="img/mark_only.png">
<link rel="apple-touch-icon" href="img/mark_only.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181D; --ink-soft:#1B2128; --ink-2:#1F262E; --ink-3:#262E37;
  --slate:#4A5460; --slate-soft:#6B7682; --steel:#97A1AB;
  --paper:#F7F4EE; --paper-2:#EFE8DA;
  --ember:#C2551B; --ember-2:#E2752E; --ember-3:#F4954A; --ember-deep:#8E3A12;
  --line-on-dark:rgba(247,244,238,0.10);
  --f-display:'Fraunces','Iowan Old Style',serif;
  --f-body:'Inter',-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',monospace;
  --ease:cubic-bezier(.22,.68,0,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100vh;}
body{
  background:var(--ink);
  color:#fff;
  font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center;
  padding:40px 20px 60px;
}
a{color:inherit;text-decoration:none;}
body::before{
  content:'';
  position:fixed; z-index:0; top:-20%; right:-15%;
  width:70vw; height:70vw; max-width:800px;
  background:radial-gradient(circle,rgba(194,85,27,0.18),rgba(194,85,27,0) 65%);
  pointer-events:none;
}
body::after{
  content:'';
  position:fixed; z-index:0; inset:0;
  background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,0.4),rgba(0,0,0,0) 60%);
  pointer-events:none;
}
.card{
  position:relative; z-index:1;
  width:100%; max-width:440px;
  background:var(--ink-2);
  border:1px solid rgba(247,244,238,0.10);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04) inset;
  animation:fadeUp .8s var(--ease) forwards;
  opacity:0;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.card-photo{position:relative;height:260px;overflow:hidden;background:var(--ink-3);}
.card-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%) contrast(1.05);}
.card-photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(20,24,29,0) 30%,rgba(20,24,29,0.85) 100%);
}
.card-photo-logo{position:absolute;top:20px;left:20px;z-index:2;display:flex;align-items:center;gap:10px;}
.card-photo-logo img{height:22px;width:auto;}
.card-photo-logo span{font-family:var(--f-display);font-size:15px;font-weight:600;color:#fff;letter-spacing:0.01em;}
.card-photo-logo span em{color:var(--ember-3);font-style:normal;}
.card-body{padding:28px 30px 32px;}
.card-role{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember-2);margin-bottom:6px;}
.card-name{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-0.01em;color:#fff;}
.card-tagline{font-size:14px;color:var(--steel);margin-top:8px;line-height:1.5;}
.divider{height:1px;background:var(--line-on-dark);margin:22px 0;}
.contact-list{display:grid;gap:14px;}
.contact-row{display:flex;align-items:center;gap:14px;}
.contact-row .ic{width:36px;height:36px;border-radius:9px;flex:none;background:var(--ink-3);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;}
.contact-row .ic svg{opacity:.75;}
.contact-row .label{font-size:11px;color:var(--steel);font-family:var(--f-mono);letter-spacing:.04em;margin-bottom:2px;}
.contact-row .value{font-size:14.5px;color:#fff;font-weight:500;}
.contact-row a.value:hover{color:var(--ember-3);}
.btn-download{
  margin-top:28px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:15px 24px;border-radius:999px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--ember-2),var(--ember-deep));
  color:#fff;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:500;
  box-shadow:0 1px 0 rgba(255,255,255,0.15) inset,0 10px 28px -10px rgba(194,85,27,0.7);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.btn-download:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,0.2) inset,0 14px 34px -10px rgba(194,85,27,0.85);}
.btn-download:active{transform:none;}
.card-footer{
  padding:16px 30px;border-top:1px solid var(--line-on-dark);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,0.15);
}
.card-footer span{font-family:var(--f-mono);font-size:10.5px;color:var(--steel);letter-spacing:.06em;}
.card-footer a{font-family:var(--f-mono);font-size:10.5px;color:var(--slate-soft);letter-spacing:.04em;transition:color .2s;}
.card-footer a:hover{color:var(--ember-3);}
.back-link{
  position:relative;z-index:1;margin-bottom:28px;
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;
  color:var(--steel);text-transform:uppercase;transition:color .2s;
}
.back-link:hover{color:#fff;}
#status{
  position:relative;z-index:1;margin-top:14px;
  font-family:var(--f-mono);font-size:12px;color:var(--ember-3);
  letter-spacing:.04em;text-align:center;min-height:18px;
  opacity:0;transition:opacity .3s;
}
#status.show{opacity:1;}
</style>
</head>
<body>

<a href="index.html" class="back-link">
  <svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M11 5H1M1 5L5 1M1 5L5 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Venture Foundry
</a>

<div class="card">
  <div class="card-photo">
    <img id="photo" src="img/Kevin Picture.jpeg" alt="Kevin Ashby">
    <div class="card-photo-logo">
      <img src="img/mark_only.png" alt="">
      <span>VENTURE <em>FOUNDRY</em></span>
    </div>
  </div>

  <div class="card-body">
    <div class="card-role" id="role">Co-Founder</div>
    <div class="card-name" id="name">Kevin Ashby</div>
    <div class="card-tagline" id="tagline">Global Partner &amp; Alliances Leader · 30+ Years in Channel &amp; Cloud</div>

    <div class="divider"></div>

    <div class="contact-list">
      <div class="contact-row">
        <div class="ic">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="white" stroke-width="1.3"/><path d="M2 7l8 5 8-5" stroke="white" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <div>
          <div class="label">Email</div>
          <a class="value" id="email-val" href="mailto:kevin@venturefoundry.ae">kevin@venturefoundry.ae</a>
        </div>
      </div>

      <div class="contact-row" id="row-phone" style="display:none">
        <div class="ic">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M6 2h8a1 1 0 011 1v14a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="white" stroke-width="1.3"/><circle cx="10" cy="16" r="1" fill="white"/></svg>
        </div>
        <div>
          <div class="label">Mobile</div>
          <a class="value" id="phone-val" href="tel:"></a>
        </div>
      </div>

      <div class="contact-row">
        <div class="ic">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5.001A2.5 2.5 0 014.98 3.5zM3 9h4v12H3V9zm7 0h3.8v1.64h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21H18v-5.6c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.96V21H10V9z"/></svg>
        </div>
        <div>
          <div class="label">LinkedIn</div>
          <a class="value" id="linkedin-val" href="https://www.linkedin.com/in/kevinpaulashby" target="_blank" rel="noopener">linkedin.com/in/kevinpaulashby</a>
        </div>
      </div>

      <div class="contact-row">
        <div class="ic">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 016 6c0 4-6 10-6 10S4 12 4 8a6 6 0 016-6z" stroke="white" stroke-width="1.3"/><circle cx="10" cy="8" r="2" stroke="white" stroke-width="1.3"/></svg>
        </div>
        <div>
          <div class="label">Location</div>
          <div class="value" id="address-val">DIFC Innovation Hub, Gate Avenue, Dubai</div>
        </div>
      </div>
    </div>

    <button class="btn-download" onclick="downloadVCF()">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2v11M10 13l-4-4M10 13l4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16h14" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
      Save Contact
    </button>
  </div>

  <div class="card-footer">
    <span>VENTURE FOUNDRY DIFC</span>
    <a href="mailto:hello@venturefoundry.ae">hello@venturefoundry.ae</a>
  </div>
</div>

<div id="status"></div>

<script>
const DEFAULTS = {
  name: 'Kevin Ashby',
  first: 'Kevin',
  last: 'Ashby',
  role: 'Co-Founder',
  tagline: 'Global Partner & Alliances Leader · 30+ Years in Channel & Cloud',
  org: 'Venture Foundry',
  email: 'kevin@venturefoundry.ae',
  phone: '',
  linkedin: 'https://www.linkedin.com/in/kevinpaulashby',
  address: 'DIFC Innovation Hub, Gate Avenue, Dubai, UAE',
  photo: 'img/kevin_square.jpg'
};

function loadData() {
  return fetch('/.netlify/functions/get-contact?who=kevin')
    .then(res => {
      if (!res.ok) throw new Error('fetch failed');
      return res.json();
    })
    .then(d => Object.assign({}, DEFAULTS, d))
    .catch(() => DEFAULTS);
}

function applyData(d) {
  document.getElementById('name').textContent = d.name;
  document.getElementById('role').textContent = d.role;
  document.getElementById('tagline').innerHTML = d.tagline;

  const emailEl = document.getElementById('email-val');
  emailEl.textContent = d.email;
  emailEl.href = 'mailto:' + d.email;

  const phoneRow = document.getElementById('row-phone');
  const phoneEl = document.getElementById('phone-val');
  if (d.phone) {
    phoneRow.style.display = 'flex';
    phoneEl.textContent = d.phone;
    phoneEl.href = 'tel:' + d.phone.replace(/\s/g, '');
  } else {
    phoneRow.style.display = 'none';
  }

  const liEl = document.getElementById('linkedin-val');
  liEl.href = d.linkedin;
  liEl.textContent = d.linkedin.replace('https://www.','').replace('https://','');

  document.getElementById('address-val').textContent = d.address;
  document.getElementById('photo').src = d.photo;
}

let data = DEFAULTS;
loadData().then(d => {
  data = d;
  applyData(data);
});

async function imageToBase64(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function foldVcfLine(line) {
  const MAX = 75;
  if (line.length <= MAX) return line;
  let out = ''; let first = true;
  while (line.length > 0) {
    const chunk = first ? line.slice(0, MAX) : line.slice(0, MAX - 1);
    out += (first ? '' : '\r\n ') + chunk;
    line = first ? line.slice(MAX) : line.slice(MAX - 1);
    first = false;
  }
  return out;
}

async function downloadVCF() {
  const btn = document.querySelector('.btn-download');
  btn.textContent = 'Preparing…';
  btn.disabled = true;
  try {
    const photoB64 = await imageToBase64(data.photo || DEFAULTS.photo);
    const mimeType = (data.photo || '').endsWith('.png') ? 'image/png' : 'image/jpeg';
    const lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      `N:${data.last};${data.first};;;`,
      `FN:${data.name}`,
      `ORG:${data.org}`,
      `TITLE:${data.role}`,
      `EMAIL;TYPE=WORK:${data.email}`,
      data.phone ? `TEL;TYPE=CELL:${data.phone}` : null,
      `URL:${data.linkedin}`,
      `ADR;TYPE=WORK:;;${data.address};;;;`,
      `NOTE:${data.tagline}`,
      foldVcfLine(`PHOTO;ENCODING=b;TYPE=${mimeType}:${photoB64}`),
      'END:VCARD'
    ].filter(Boolean).join('\r\n');

    const blob = new Blob([lines], {type:'text/vcard;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${data.first}_${data.last}_VentureFoundry.vcf`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);

    const s = document.getElementById('status');
    s.textContent = 'Contact saved — check your downloads.';
    s.classList.add('show');
    setTimeout(() => s.classList.remove('show'), 4000);
  } catch(err) {
    console.error(err);
    alert('Could not generate contact file. Try again.');
  } finally {
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2v11M10 13l-4-4M10 13l4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16h14" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg> Save Contact`;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
